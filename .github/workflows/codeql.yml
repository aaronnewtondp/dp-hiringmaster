name: CodeQL

# Advanced setup (this file). Do NOT also switch on "default setup" under Settings > Code security: GitHub disables an
# existing CodeQL workflow when default setup is enabled. Code scanning is free for public repositories.
#
# Results appear under Security > Code scanning. This workflow reports; it does not block a merge by itself (that is a
# branch-protection rule on code-scanning results, which this repository does not have).
#
# Pull requests from forks get a read-only token, so the upload step cannot write results for them and the run is
# reported as failed. That is GitHub's rule, not a defect here; the push-to-main and weekly runs still cover merged code.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # Mondays 03:17 UTC: picks up new CodeQL queries without a code change
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload the SARIF results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none   # interpreted languages need no build
          queries: security-extended   # the default suite plus lower-precision security queries
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
