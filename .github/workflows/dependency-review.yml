name: Dependency review

# Blocks a pull request that ADDS or UPDATES a dependency to a version with a known high or critical advisory, using the
# dependency graph (every package-lock.json in the repo). It looks only at what the PR changes, so an advisory that
# already exists on main does not fail unrelated PRs (see audit.yml for that).
# Needs the dependency graph, which is always on for a public repository.
#
# comment-summary-in-pr is off on purpose: posting a PR comment needs `pull-requests: write`, and this workflow
# is kept to read-only permissions. The result is in the job summary and the check.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development   # dev tooling runs in CI and on developer machines too
          comment-summary-in-pr: never
          license-check: false   # no licence policy exists; add allow-licenses before turning this on
