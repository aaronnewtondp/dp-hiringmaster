name: Integration (API and database specs)

# The Playwright `api` and `db` projects against a real backend and a real Postgres, with NO credentials. Nightly and on demand,
# never on a pull request. No repository secret is needed: the ingest and JWT secrets are generated per run.
#
# What it runs: every spec in hms-tests-final/tests/api and tests/db EXCEPT the tests tagged @live (see EXCLUDE below). Measured on
# 2026-11-17 with no credentials (a test-stack.sh stack: empty environment, SOURCING_ENABLED=true) and a fresh database each run: the two
# projects hold 932 tests that are not tagged @live; three full runs with EXCLUDE = '@live' alone passed 931 and skipped 1 (the real
# Google Calendar round trip, api/15) in 1-2.3 minutes. Left out on purpose, so a red run here means a real regression and not a
# missing key:
#   * browser specs (tests/e2e, tests/e2e-mobile): not in this job; they run in the second job, `e2e`, below (a production build served
#     by `vite preview`, `playwright install --with-deps chromium`, --project=e2e --project=e2e-mobile, same Postgres service and
#     per-run secrets, no credentials).
#   * tests/smoke: production-only, read-only checks against the live deployment.
# The suite's own documentation puts the full local run at ~45 minutes; almost all of that is the browser project and the real
# Claude / Google calls, not these specs.
#
# EXCLUDE (a Playwright --grep-invert regex over the full test title, which includes the file name). A command-line --grep-invert
# REPLACES playwright.config.ts's own `grepInvert: /@live/`, so `@live` has to be in this regex or the tests that need a real key
# would run here. The one entry:
#   @live   every test tagged @live (needs a real Anthropic key or Google credentials; skipped by the config unless TEST_LIVE=1).
#           Today: db/07 "a candidate with NO readable resume ... (the creation-time hook, with a real model)", api/10 "role Approved ->
#           real JD generation ...", api/30 "brand-new role with a unique title falls back to a live AI estimate", plus the two e2e
#           ones that this job does not run anyway.
# Dropped on 2026-11-17 (measured, 5 fresh-database runs of api/10 + api/19 + api/30 with '@live' only, then 3 full runs: all green):
#   JD Generation + ResumeIQ scoring (real external calls)   api/10: its real-key test is tagged @live now; the two that remain are
#                                                             offline tests of the same contract and need no key
#   every candidate entry carries application_id             api/19: the test creates and backdates its own breach, so it no longer
#                                                             depends on a long-lived dev database
#   falls back to a live AI estimate                         api/30: it matched only the @live-tagged test, so it was redundant
# Dropped earlier: db/17's two old-token tests (rewritten to pin the 401 since PR #55), db/05 (builds its e-mails from a per-run id and a
# counter now), db/07's two "needs a real base score" tests (they write the base scores by SQL now; only the creation-time hook needs the
# model, and its test is tagged @live) and db/15's queue-error test.
# Remove an entry when its cause is fixed; do not add one without a measured reason.

on:
  workflow_dispatch:
  schedule:
    - cron: "30 20 * * *"   # 20:30 UTC = 02:00 IST

concurrency:
  group: integration
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"

jobs:
  api-and-db-specs:
    name: Playwright api + db projects (no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password   # the db specs hard-code postgresql://hms_user:hms_password@localhost:5432/dp_hms
          POSTGRES_DB: dp_hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms_user -d dp_hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: hms_user
      PGPASSWORD: hms_password
      PGDATABASE: dp_hms
      EXCLUDE: '@live'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            hms-tests-final/package-lock.json
      - name: Install backend and test dependencies (Playwright browsers are not needed for api and db)
        run: |
          npm ci --prefix backend
          npm ci --prefix hms-tests-final
      - name: psql client
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql --version
      - name: Per-run secrets (generated, masked, never stored)
        run: |
          for name in JWT_SECRET ROLE_INGEST_SECRET CANDIDATE_INGEST_SECRET CRON_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build the database (schema.sql, then seed.sql)
        run: bash .github/ci/apply-db.sh
      - name: Start the backend (npx tsx src/server.ts, no Anthropic or Google credentials)
        working-directory: backend
        env:
          NODE_ENV: development   # rate limiters are skipped outside production, as in the local suite
          PORT: "4000"
          DATABASE_URL: postgresql://hms_user:hms_password@localhost:5432/dp_hms
          FRONTEND_URL: http://localhost:5173
          SOURCING_ENABLED: "true"   # on in production since 2026-10-20; the sourcing specs skip themselves when it is off
        run: |
          npx tsx src/server.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:4000/health
      - name: Playwright (api and db projects)
        working-directory: hms-tests-final
        env:
          TEST_API_URL: http://localhost:4000
          TEST_JWT_SECRET: ${{ env.JWT_SECRET }}   # api/42, 44, 45 forge tokens; they must sign with the per-run secret the backend was started with
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=api --project=db --grep-invert "$EXCLUDE" --reporter=list,html
      - name: Stop the backend
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/backend.pid" ]; then kill "$(cat "$RUNNER_TEMP/backend.pid")" 2>/dev/null || true; fi
      - name: Keep the Playwright report and the backend log when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-failure-${{ github.run_id }}
          path: |
            hms-tests-final/playwright-report/
            hms-tests-final/test-results/
            ${{ runner.temp }}/backend.log
          retention-days: 7
          if-no-files-found: warn

  e2e:
    name: Playwright e2e + e2e-mobile projects (production build, no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hms_user
          POSTGRES_PASSWORD: hms_password   # the db helpers hard-code postgresql://hms_user:hms_password@localhost:5432/dp_hms
          POSTGRES_DB: dp_hms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hms_user -d dp_hms"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: hms_user
      PGPASSWORD: hms_password
      PGDATABASE: dp_hms
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
            hms-tests-final/package-lock.json
      - name: Install frontend, backend and test dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix backend
          npm ci --prefix hms-tests-final
      - name: Install Chromium for Playwright (with its system libraries)
        working-directory: hms-tests-final
        run: npx playwright install --with-deps chromium
      - name: psql client
        run: |
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client; }
          psql --version
      - name: Per-run secrets (generated, masked, never stored)
        run: |
          for name in JWT_SECRET ROLE_INGEST_SECRET CANDIDATE_INGEST_SECRET CRON_SECRET; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build the database (schema.sql, then seed.sql)
        run: bash .github/ci/apply-db.sh
      - name: Start the backend (npx tsx src/server.ts, no Anthropic or Google credentials)
        working-directory: backend
        env:
          NODE_ENV: development   # rate limiters are skipped outside production, as in the local suite
          PORT: "4000"
          DATABASE_URL: postgresql://hms_user:hms_password@localhost:5432/dp_hms
          FRONTEND_URL: http://localhost:5173
          SOURCING_ENABLED: "true"   # on in production since 2026-10-20; the sourcing specs skip themselves when it is off
        run: |
          npx tsx src/server.ts > "$RUNNER_TEMP/backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/backend.pid"
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:4000/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:4000/health
      - name: Build the frontend (production build, API URL baked in)
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000/api
        run: npx vite build
      - name: Serve the build (vite preview on 5173)
        working-directory: frontend
        run: |
          npx vite preview --port 5173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/preview.pid"
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:5173/ >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:5173/ >/dev/null
      - name: Playwright (e2e and e2e-mobile projects)
        working-directory: hms-tests-final
        env:
          TEST_API_URL: http://localhost:4000
          TEST_FRONTEND_URL: http://localhost:5173
          TEST_JWT_SECRET: ${{ env.JWT_SECRET }}   # specs that forge tokens must sign with the per-run secret the backend was started with
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright test --project=e2e --project=e2e-mobile --reporter=list,html
      - name: Stop the backend and the preview server
        if: always()
        run: |
          for f in backend preview; do
            if [ -f "$RUNNER_TEMP/$f.pid" ]; then kill "$(cat "$RUNNER_TEMP/$f.pid")" 2>/dev/null || true; fi
          done
      - name: Keep the Playwright report and the server logs when something failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}
          path: |
            hms-tests-final/playwright-report/
            hms-tests-final/test-results/
            ${{ runner.temp }}/backend.log
            ${{ runner.temp }}/preview.log
          retention-days: 7
          if-no-files-found: warn
