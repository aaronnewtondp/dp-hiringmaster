name: Secret scan

# gitleaks CLI, pinned by version AND sha256. The CLI is MIT-licensed and needs no key. (gitleaks-action needs a paid license
# for an organization account and nothing for a personal one; this repository is personal today, but the CLI does not
# break if it ever moves to an organization. trufflehog is AGPL-3.0 and, to avoid noise, wants verification calls out to
# the services a candidate secret belongs to.)
#
# Pull requests and pushes: only the NEW commits. Weekly and on demand: the whole history.
# GitHub's own secret scanning and push protection are repository SETTINGS, not workflow files; they are already on.
#
# This repository is public, so job logs are public. Findings are redacted (--redact), and nothing but file, line and rule
# is printed: no secret value, no author, no e-mail. Never remove --redact.
#
# Exceptions live in .github/gitleaks.toml, each scoped to one rule, one path and one value (or one commit); read its header
# before adding one.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"   # Mondays 02:41 UTC, full history
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb   # gitleaks_8.30.1_linux_x64.tar.gz, from the release's checksums file

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # a commit range, or the whole history, needs the commits
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum-verified)
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256_LINUX_X64}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
      - name: Scan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          # Which commits: a PR's own, a push's own, or (schedule, manual run) everything.
          range=""
          case "$EVENT" in
            pull_request) range="${PR_BASE}..${PR_HEAD}" ;;
            push)
              # a first push has an all-zero "before"; a force-push can leave "before" unreachable: scan everything then
              if git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then range="${PUSH_BEFORE}..${PUSH_AFTER}"; fi
              ;;
          esac
          echo "scope: ${range:-full history} (event: $EVENT)"

          args=(--config .github/gitleaks.toml --redact --no-banner --exit-code 7 --report-format json --report-path "$RUNNER_TEMP/gitleaks.json")
          if [ -n "$range" ]; then args+=(--log-opts "$range"); fi

          rc=0
          "$RUNNER_TEMP/gitleaks" git "${args[@]}" . || rc=$?

          if [ "$rc" -eq 0 ]; then
            echo "No secrets found." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$rc" -ne 7 ] || [ ! -s "$RUNNER_TEMP/gitleaks.json" ]; then
            echo "::error::gitleaks itself failed (exit $rc); this is a tooling failure, not a finding"
            exit 1
          fi

          # Findings: file, line and rule ONLY (the report also holds author and commit metadata, which stays out of the log).
          jq -r '.[] | "::error file=\(.File),line=\(.StartLine),title=Possible secret (\(.RuleID))::A value matching rule \(.RuleID) was committed. The value is not shown. See .github/gitleaks.toml before adding an exception."' "$RUNNER_TEMP/gitleaks.json"
          {
            echo "### Possible secrets"
            echo
            echo "| File | Line | Rule |"
            echo "|---|---|---|"
            jq -r '.[] | "| `\(.File)` | \(.StartLine) | `\(.RuleID)` |"' "$RUNNER_TEMP/gitleaks.json"
            echo
            echo "A secret that reached the history must be treated as exposed: rotate it, then remove it. Rewriting history alone does not un-expose it."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
